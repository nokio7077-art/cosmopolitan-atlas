<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru; connect-src 'self' https://examtwlpaeheturjkacc.supabase.co https://mc.yandex.ru">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="canonical" href="https://cosmopolitan-atlas.online/country.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Cosmopolitan — атлас памяти">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Страна мира: столица, флаг и место на карте | Cosmopolitan">
<meta property="og:description" content="Карточка страны: столица, флаг с фактом о нём, координаты и карта, где находится государство — включая самые маленькие страны мира.">
<meta property="og:url" content="https://cosmopolitan-atlas.online/country.html">
<meta property="og:image" content="https://cosmopolitan-atlas.online/favicon-512.png">
<meta name="twitter:card" content="summary">
<title>Страна мира: столица, флаг и место на карте | Cosmopolitan</title>
<meta name="description" content="Карточка страны: столица, флаг с фактом о нём, координаты и карта, где находится государство — включая самые маленькие страны мира.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
CA.ready(function () {
  var el = CA.el, k = CA.kicker;
  var c = CA.byIso((CA.qs("iso") || "").toLowerCase());

  function setMeta(attr, key, value) {
    var m = document.querySelector("meta[" + attr + '="' + key + '"]');
    if (!m) { m = document.createElement("meta"); m.setAttribute(attr, key); document.head.appendChild(m); }
    m.setAttribute("content", value);
  }

  if (!c) {
    CA.mount(el("div", { class: "screen" }, [
      el("h1", { class: "big", style: "font-size:clamp(30px,4vw,44px);margin-bottom:14px" }, ["Страна не найдена"]),
      el("p", { class: "lede", style: "margin:0 0 24px" }, ["Возможно, ссылка неполная. Найдите страну через поиск на главной."]),
      el("a", { class: "btn primary", href: "index.html" }, ["На главную"])
    ]));
    return;
  }

  // Страница у всех стран одна, различаются они параметром iso. Поэтому заголовок,
  // описание и canonical проставляем под конкретную страну: иначе в поиске окажется
  // 192 одинаковых карточки.
  var pageUrl = "https://cosmopolitan-atlas.online/country.html?iso=" + c.f;
  document.title = c.n + " — столица " + c.c + ", флаг и место на карте";
  setMeta("name", "description",
    c.n + ": столица — " + c.c + ", флаг с фактом о нём, координаты и карта, где находится страна. " +
    "Регион: " + CA.regionName(c.r) + ".");
  setMeta("property", "og:title", document.title);
  setMeta("property", "og:url", pageUrl);
  setMeta("property", "og:image", "https://cosmopolitan-atlas.online/flags/" + c.f + ".svg");
  var link = document.querySelector('link[rel="canonical"]');
  if (link) link.setAttribute("href", pageUrl);

  var e = CA.entry(c.f);
  var rows = [
    ["Столица", c.c],
    ["Регион", CA.regionName(c.r)],
    ["Код", c.f.toUpperCase()],
    ["Координаты столицы", c.lat.toFixed(2) + ", " + c.lng.toFixed(2)],
    ["Ваши попытки", e ? e.attempts + " · ошибок " + (e.mistakes.capital + e.mistakes.flag + e.mistakes.map) : "ещё не играли"]
  ];

  var idx = COUNTRIES.filter(function (x) { return x.r === c.r; }).sort(function (a, b) { return a.n.localeCompare(b.n, "ru"); });
  var pos = idx.map(function (x) { return x.f; }).indexOf(c.f);
  var prev = idx[(pos - 1 + idx.length) % idx.length], nxt = idx[(pos + 1) % idx.length];

  CA.mount(el("div", { class: "screen" }, [
    el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:16px;flex-wrap:wrap" }, [
      el("a", { href: "index.html" }, ["← Индекс стран"]),
      k(CA.regionName(c.r) + (CA.isStudied(c.f) ? " · изучено" : ""))
    ]),
    el("h1", { class: "big", style: "font-size:clamp(38px,7vw,76px);margin-bottom:26px" }, [c.n]),
    el("div", { class: "grid two", style: "align-items:start" }, [
      el("div", {}, [
        el("img", { src: CA.flagUrl(c.f), alt: "Флаг " + c.n, decoding: "async", style: "display:block;width:100%;aspect-ratio:3/2;object-fit:contain;background:var(--n200);border:1px solid var(--divider)" }),
        el("table", { style: "margin-top:18px" }, [el("tbody", {}, rows.map(function (r) {
          return el("tr", {}, [el("td", {}, [r[0]]), el("td", { style: "text-align:right" }, [r[1]])]);
        }))]),
        el("div", { style: "margin-top:18px" }, [
          el("a", { class: "btn primary block", href: "play.html?iso=" + c.f, style: "text-align:center" }, ["Сыграть эту страну"])
        ])
      ]),
      el("div", {}, [
        CA.mapSvg({ highlight: c.f, highlightFill: "#0088b0" }),
        FLAG_FACTS[c.f] ? el("div", { class: "fact" }, [k("О флаге", "ac"), el("p", {}, [FLAG_FACTS[c.f]])]) : null,
        el("div", { class: "row", style: "margin-top:26px" }, [
          el("a", { class: "btn ghost", href: "country.html?iso=" + prev.f }, ["← " + prev.n]),
          el("a", { class: "btn ghost", href: "country.html?iso=" + nxt.f }, [nxt.n + " →"])
        ])
      ])
    ])
  ]));
});
</script>
</body>
</html>
