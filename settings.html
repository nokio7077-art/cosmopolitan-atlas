<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru; connect-src 'self' https://examtwlpaeheturjkacc.supabase.co https://mc.yandex.ru">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Настройки — Cosmopolitan</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" integrity="sha384-CLZeq1dk8+Uzrs7TVvBUdlFoV5F0DMqgRoeHa8g5wJcuPe5SkVfEvdxB0ZuzlnBQ" crossorigin="anonymous"></script>
<script>
  window.SUPABASE_URL = "https://examtwlpaeheturjkacc.supabase.co";
  window.SUPABASE_ANON_KEY = "sb_publishable_ivn0-52SCJ61gQ2vC7LyZw_QLvz6Ymy";
</script>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
CA.ready(function () {
  var el = CA.el, k = CA.kicker, p = CA.progress, app = document.getElementById("app");
  var msg = null, codeMsg = null, codeInput = "";

  // Код игрока — единственный способ вернуть свой номер после очистки данных
  // браузера или на другом устройстве: логинов на сайте нет.
  function codeBlock() {
    var box = el("div", { style: "margin-top:12px" });
    var mine = CA.myCode();
    if (mine) {
      box.appendChild(el("div", { class: "code" }, [mine]));
      box.appendChild(el("p", { style: "margin:12px 0 0;font-size:16px;color:var(--n800);max-width:60ch" }, [
        "Запишите этот код в дневник или тетрадь. Если браузер очистит данные сайта или вы сядете за другой компьютер — введите код ниже, и ваш номер вернётся вместе со всеми результатами в рейтинге."
      ]));
    } else {
      box.appendChild(el("p", { style: "margin:0;font-size:16px;color:var(--n800);max-width:60ch" }, [
        "Код появится, как только вы выберете титул. По нему номер возвращается после очистки браузера — без пароля и регистрации."
      ]));
    }
    var input = el("input", { class: "input", id: "code", type: "text", placeholder: "Например, 0B-01FQ", autocomplete: "off",
      style: "margin-top:10px;text-transform:uppercase",
      oninput: function (e) { codeInput = e.target.value; },
      onkeydown: function (e) { if (e.key === "Enter") applyCode(); } });
    box.appendChild(el("div", { class: "row", style: "align-items:flex-end;margin-top:20px;max-width:560px" }, [
      el("div", { class: "field", style: "flex:1;min-width:200px" }, [el("label", { class: "kicker", for: "code" }, ["Ввести код игрока"]), input]),
      el("button", { class: "btn", type: "button", onclick: applyCode }, ["Восстановить"])
    ]));
    if (codeMsg) box.appendChild(el("p", { class: codeMsg[0] ? "ok" : "bad", style: "margin:10px 0 0;font-size:16px" }, [codeMsg[1]]));
    setTimeout(function () { var i = document.getElementById("code"); if (i && codeInput) i.value = codeInput; }, 0);
    return box;
  }
  function applyCode() {
    var parsed = CA.readPlayerCode(codeInput);
    if (!parsed) { codeMsg = [false, "Такой код не подходит — проверьте, все ли знаки на месте."]; render(); return; }
    CA.restorePlayer(codeInput);
    codeInput = ""; codeMsg = [true, "Готово, вы снова " + CA.currentDisplayName() + "."];
    render();
  }

  function render() {
    app.innerHTML = "";
    var me = CA.currentDisplayName();
    var titles = el("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 20px;margin-top:16px" },
      CA.PERSONAS.map(function (title) {
        var active = p.playerTitle === title;
        return el("button", {
          class: "btn" + (active ? " primary" : " ghost"), type: "button", style: "text-align:left",
          onclick: function (e) {
            var b = e.currentTarget; b.disabled = true;
            CA.pickPersona(title, function (ok, err) {
              msg = ok ? null : ("Не получилось: " + err);
              render();
            });
          }
        }, [title]);
      }));

    CA.mount(el("div", { class: "screen", style: "max-width:760px" }, [
      el("h1", { class: "big", style: "font-size:clamp(30px,4vw,44px);margin-bottom:14px" }, ["Настройки"]),
      el("p", { class: "lede", style: "margin:0 0 32px" }, ["Прогресс хранится только в этом браузере. Для рейтинга недели нужен титул — номер к нему присвоится сам, а код игрока вернёт его, если браузер очистят."]),

      k("Титул в рейтинге"),
      el("p", { style: "margin:8px 0 0;font-size:16px;color:var(--n800)" }, me
        ? ["Сейчас вы — ", el("b", { style: "font-weight:600" }, [me]), ". Номер закреплён навсегда, титул можно менять."]
        : ["Выберите титул — номер присвоится сам, по порядку регистрации, и останется с вами навсегда."]),
      msg ? el("p", { class: "bad", style: "margin:8px 0 0;font-size:16px" }, [msg]) : null,
      titles,

      el("div", { style: "margin-top:44px" }, [k("Код игрока")]),
      codeBlock(),

      el("div", { style: "margin-top:44px" }, [k("Данные")]),
      el("div", { class: "list", style: "margin-top:12px" }, [
        el("div", { class: "li" }, [el("span", {}, ["Изучено стран"]), el("span", {}, [String(CA.studiedCount("world"))])]),
        el("div", { class: "li" }, [el("span", {}, ["Рекорд сессии"]), el("span", {}, [String(p.highScore || 0)])]),
        el("div", { class: "li" }, [el("span", {}, ["Раундов сыграно"]), el("span", {}, [String(p.totalRounds || 0)])]),
        CA.premiumEnabled ? el("div", { class: "li" }, [el("span", {}, ["Подсказки"]), el("span", {}, [String(p.hints || 0)])]) : null
      ]),
      el("div", { style: "margin-top:26px" }, [
        el("button", { class: "btn", type: "button", onclick: function () {
          if (!confirm("Сбросить весь прогресс? Титул и номер останутся.")) return;
          p.perCountry = {}; p.highScore = 0; p.totalRounds = 0; p.premium = false; p.hints = 0;
          CA.saveProgress(); render();
        } }, ["Сбросить прогресс"])
      ]),
      el("p", { style: "margin-top:32px;font-size:15px;line-height:25px;color:var(--n700)" }, [
        "Что именно хранится и зачем — на странице ", el("a", { href: "privacy.html" }, ["политики конфиденциальности"]), "."
      ])
    ]));
  }
  render();
});
</script>
</body>
</html>
