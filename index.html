<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru; connect-src 'self' https://examtwlpaeheturjkacc.supabase.co https://mc.yandex.ru">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>Cosmopolitan — атлас памяти: столицы, флаги, карта мира</title>
<meta name="description" content="Игра для изучения географии: столицы, флаги и расположение 192 стран на карте мира, с фактом о каждом флаге.">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js" integrity="sha384-CLZeq1dk8+Uzrs7TVvBUdlFoV5F0DMqgRoeHa8g5wJcuPe5SkVfEvdxB0ZuzlnBQ" crossorigin="anonymous"></script>
<script>
  window.SUPABASE_URL = "https://examtwlpaeheturjkacc.supabase.co";
  window.SUPABASE_ANON_KEY = "sb_publishable_ivn0-52SCJ61gQ2vC7LyZw_QLvz6Ymy";
</script>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
CA.ready(function () {
  var el = CA.el, k = CA.kicker;

  function resultsFor(q) {
    var n = CA.norm(q);
    if (n.length < 2) return [];
    return COUNTRIES.filter(function (c) {
      return CA.norm(c.n).indexOf(n) === 0 || CA.norm(c.c).indexOf(n) === 0 || c.f === q.trim().toLowerCase();
    }).slice(0, 6);
  }

  var resBox = el("div", { class: "list", style: "max-width:520px;margin-top:14px" });
  var input = el("input", {
    class: "input", type: "text", id: "q", placeholder: "Португалия, Лиссабон, pt…",
    autocomplete: "off", style: "margin-top:10px",
    oninput: function (e) {
      resBox.innerHTML = "";
      resultsFor(e.target.value).forEach(function (c) {
        resBox.appendChild(el("a", { class: "li clickable", href: "country.html?iso=" + c.f }, [
          el("span", { style: "display:flex;align-items:center;gap:12px" }, [
            el("img", { src: CA.flagUrl(c.f), alt: "", loading: "lazy", decoding: "async", style: "width:36px;aspect-ratio:4/3;object-fit:contain;background:var(--n200)" }),
            el("b", { style: "font-weight:600" }, [c.n])
          ]),
          el("span", { style: "color:var(--n700);font-size:15px" }, [c.c + " · " + CA.regionName(c.r)])
        ]));
      });
    }
  });

  var studied = CA.studiedCount("world");
  var hero = el("div", { class: "grid two", style: "align-items:center" }, [
    el("div", {}, [
      el("h1", { class: "big", style: "font-size:clamp(36px,5.5vw,60px);margin-bottom:18px" }, ["Откройте атлас там, где вам интересно."]),
      el("p", { class: "lede", style: "margin:0 0 28px" }, ["Привет, дорогой друг! Этот сайт создан для того, чтобы как можно больше людей знали географию — играючи запоминали столицы, флаги и расположение стран на карте."]),
      el("div", { class: "field", style: "max-width:420px" }, [el("label", { class: "kicker", for: "q" }, ["Поиск по странам"]), input]),
      resBox,
      el("div", { class: "row", style: "margin-top:28px" }, [
        el("a", { class: "btn primary", href: "play.html" }, ["Начать путешествие"]),
        el("a", { class: "btn", href: "flags.html" }, ["Угадай страну по флагу"]),
        el("a", { class: "btn ghost", href: "learn.html" }, ["Карточки"])
      ]),
      studied > 0 ? el("p", { style: "margin:24px 0 0;font-size:16px;color:var(--n800)" }, ["Уже изучено стран: " + studied + " из " + COUNTRIES.length + ". Рекорд сессии — " + (CA.progress.highScore || 0) + "."]) : null
    ]),
    CA.mapSvg({})
  ]);

  var modes = el("div", { style: "padding-top:72px" }, [
    el("h2", { style: "font-size:32px;line-height:36px;margin-bottom:28px" }, ["Три способа запоминать"]),
    el("div", { class: "tile-list" }, [
      ["play.html", "Играть", "Столица вручную, флаг из полного списка, точка на карте. Три шага за раунд, комбо ×1.5 за три чистых страны подряд.", "ac"],
      ["flags.html", "Флаги", "Показываем флаг — вы пишете страну. Двадцать флагов занимают минут пять.", null],
      ["learn.html", "Карточки", "Обучение без таймера: на обороте столица, координаты и факт о флаге.", null],
      ["board.html", "Рейтинг недели", "Лучшая сессия за семь дней. Титул и номер присваиваются сами, без регистрации.", "sp"]
    ].map(function (m) {
      return el("a", { class: "tile", href: m[0] }, [
        k(m[1] === "Рейтинг недели" ? "Новое" : "Режим", m[3]),
        el("h3", { style: "margin:8px 0 6px" }, [m[1]]),
        el("p", { style: "margin:0;font-size:16px;line-height:27px;color:var(--n800);max-width:42ch" }, [m[2]])
      ]);
    }))
  ]);

  var featured = CA.shuffle(COUNTRIES).slice(0, 8);
  var index = el("div", { style: "padding-top:72px" }, [
    el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:20px" }, [
      el("h2", { style: "font-size:32px;line-height:36px" }, ["Индекс стран"]),
      k(COUNTRIES.length + " карточек с фактами о флагах")
    ]),
    el("div", { style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px" }, featured.map(function (c) {
      return el("a", { class: "card", href: "country.html?iso=" + c.f }, [
        el("img", { src: CA.flagUrl(c.f), alt: "Флаг " + c.n, loading: "lazy", decoding: "async" }),
        el("div", { class: "t" }, [c.n]),
        el("div", { class: "m" }, [c.c + " · " + CA.regionName(c.r)])
      ]);
    }))
  ]);

  CA.mount(el("div", { class: "screen" }, [hero, modes, index]));
});
</script>
</body>
</html>
