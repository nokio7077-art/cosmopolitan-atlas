CA.ready(function () {

  function render() {
    app.innerHTML = "";
    var node = st.view === "regions" ? viewRegions()

    CA.playMode(st.view === "round");

  function saveGame() {
    var r = st.round;
    CA.saveSession({
      v: 1, region: st.region, queue: st.queue.map(function (c) { return c.f; }), i: st.i,
      score: st.score, combo: st.combo, mistakes: st.mistakes, capital: st.capital,
      difficulty: st.difficulty, sizeKey: st.sizeKey, view: st.view, tally: st.tally,

  // Карту в снимок не кладём: там живой DOM. Она соберётся заново, зато шаг,

  function restoreGame(s) {
    if (!s || s.v !== 1 || !s.queue || !s.queue.length) return false;

    st.tally = s.tally || { cap: 0, flag: 0, map: 0, clean: 0 };
    st.view = s.view === "end" ? "end" : "round";
    if (s.round) {

      var r = newRound(c);
      ["step", "capOk", "capDone", "hint", "capOptions", "flagDone", "flagOk", "pick",

      if (s.round.flagOptions) r.flagOptions = s.round.flagOptions.map(CA.byIso).filter(Boolean);
      st.round = r;
    } else st.round = newRound(st.queue[st.i]);
    return true;
  }
  function newRound(c) {
    return { c: c, step: "capital", capOk: false, capDone: false, hint: null, capOptions: null,
      flagDone: false, flagOk: false, pick: null, flagOptions: null,
      mapDone: false, mapOk: false, aim: null, picker: null, click: null, target: null, points: 0, mult: 1 };
  }
  function capOptionsFor(c) {
    var seen = {}; seen[CA.norm(c.c)] = true;
    var pool = CA.shuffle(COUNTRIES.filter(function (x) { return x.f !== c.f; }));
    var picks = [];
    for (var i = 0; i < pool.length && picks.length < 3; i++) {
      var key = CA.norm(pool[i].c);
      if (seen[key]) continue;
      seen[key] = true; picks.push(pool[i].c);
    }
    return CA.shuffle(picks.concat([c.c]));
  }
  function flagOptionsFor(c) {
    var pool = CA.shuffle(COUNTRIES.filter(function (x) { return x.f !== c.f; })).slice(0, 3);
    return CA.shuffle(pool.concat([c]));
  }
  function start(regionKey, size, forced) {
    CA.clearSession();
    var list = forced || CA.regionCountries(regionKey);
    st.region = regionKey;
    st.queue = forced ? forced : CA.shuffle(list).slice(0, Math.min(size || list.length, list.length));
    st.i = 0; st.score = 0; st.combo = 0; st.mistakes = {}; st.capital = "";
    st.tally = { cap: 0, flag: 0, map: 0, clean: 0 };
    st.submitted = false; st.sending = false; st.submitMsg = null;
    st.round = newRound(st.queue[0]); st.view = "round"; render();
  }

  function viewRegions() {
    return el("div", { class: "screen" }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px" }, [
        el("a", { href: "index.html" }, ["← На главную"]), k("Режим «Играть»")
      ]),
      el("h1", { class: "big", style: "font-size:clamp(32px,4.5vw,48px);margin-bottom:26px" }, ["Где сегодня играем?"]),
      el("div", { class: "tile-list" }, ["world"].concat(CA.REGION_ORDER).map(function (key) {
        var list = CA.regionCountries(key), done = CA.studiedCount(key), locked = !CA.unlocked(key);
        return el("a", {
          class: "tile", href: locked ? "premium.html" : "#",
          onclick: function (e) { if (locked) return; e.preventDefault(); st.region = key; st.view = "setup"; render(); }
        }, [
          el("div", { class: "tile-head" }, [
            CA.regionIcon(key),
            el("h3", {}, [CA.regionName(key)]), locked ? el("span", { class: "tag" }, ["Премиум"]) : null
          ]),
          el("div", { class: "meta", style: "margin-top:12px" }, [el("span", {}, [done + "/" + list.length + " изучено"]), el("span", {}, [list.length + " стран"])]),
          CA.bar(Math.round(100 * done / Math.max(1, list.length)))
        ]);
      }))
    ]);
  }

  function viewSetup() {
    var list = CA.regionCountries(st.region);
    // Количество — такой же выбор, как сложность: кнопка «10 стран» не должна

    var sizes = [["10", "10 стран", 10], ["20", "20 стран", 20], ["all", "Весь регион (" + list.length + ")", list.length]];
    var pick = sizes[0];
    sizes.forEach(function (sz) { if (sz[0] === st.sizeKey) pick = sz; });

    return el("div", { class: "screen" }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px" }, [
        el("a", { href: "#", onclick: function (e) { e.preventDefault(); st.view = "regions"; render(); } }, ["← Регионы"]),
        k(CA.regionName(st.region) + " · " + list.length + " стран")
      ]),
      el("h1", { class: "big", style: "font-size:clamp(32px,4.5vw,48px);margin-bottom:14px" }, ["Сколько стран разыграть?"]),
      el("p", { class: "lede", style: "margin:0 0 22px" }, ["Десять — короткая разминка, весь регион — серьёзная работа. Прогресс считается в любом случае."]),
      el("div", { style: "margin-bottom:26px" }, [
        k("Сложность · шаг «столица»"),
        el("div", { class: "row", style: "margin-top:10px" }, [
          el("button", {
            class: "btn" + (st.difficulty === "easy" ? " primary" : " ghost"), type: "button",
            onclick: function () { st.difficulty = "easy"; render(); }
          }, ["Легко · выбрать из 4 вариантов"]),
          el("button", {
            class: "btn" + (st.difficulty === "hard" ? " primary" : " ghost"), type: "button",
            onclick: function () { st.difficulty = "hard"; render(); }
          }, ["Сложно · ввести вручную"])
        ])
      ]),
      el("div", { style: "margin-bottom:30px" }, [
        k("Сколько стран"),
        el("div", { class: "row", style: "margin-top:10px" }, sizes.map(function (sz) {
          return el("button", {
            class: "btn" + (st.sizeKey === sz[0] ? " primary" : " ghost"), type: "button",
            onclick: function () { st.sizeKey = sz[0]; render(); }

      el("div", { class: "startbar" }, [
        el("button", { class: "btn primary go", type: "button", onclick: function () { start(st.region, pick[2]); } }, ["Играть →"]),
        el("span", { class: "startnote" }, [
          CA.regionName(st.region) + " · " + pick[2] + " " + countryWord(pick[2]) +
          " · " + (st.difficulty === "easy" ? "лёгкий уровень" : "сложный уровень")
        ])
      ])
    ]);
  }
  function countryWord(n) {
    var t = n % 100, o = n % 10;
    if (t > 10 && t < 20) return "стран";
    if (o === 1) return "страна";
    if (o > 1 && o < 5) return "страны";
    return "стран";
  }

  // Полоса хода в шапке. Раунд из трёх шагов, поэтому заполняем её и внутри
  // раунда: иначе она стояла бы на месте, пока человек отвечает на три вопроса.
  var STEP_PART = { capital: 0, flag: 1 / 3, map: 2 / 3, summary: 1 };
  function roundBar() {
    var n = st.queue.length, r = st.round || {};
    var part = STEP_PART[r.step] != null ? STEP_PART[r.step] : 0;
    return CA.gameBar({
      label: (st.i + 1) + " / " + n,
      aria: "Раунд " + (st.i + 1) + " из " + n,
      ratio: n ? (st.i + part) / n : 0,
      combo: st.combo >= 3 ? "×1.5" : null,
      score: st.score
    });
  }

  function viewRound() {
    var box = el("div", { class: "screen" }, []);
    var r = st.round;
    box.appendChild(r.step === "capital" ? stepCapital(r) : r.step === "flag" ? stepFlag(r) : r.step === "map" ? stepMap(r) : stepSummary(r));
    return box;
  }

  function stepCapital(r) {
    var box = el("div", { style: "padding-top:26px" }, [
      k("Шаг 1 из 3 · столица", "ac"),
      el("h1", { class: "big", style: "margin:14px 0 12px" }, [r.c.n])
    ]);
    if (!r.capDone) box.appendChild(el("p", { class: "ask" }, [
      st.difficulty === "easy" ? "Выберите столицу этой страны" : "Напишите столицу этой страны"
    ]));
    if (st.difficulty === "easy") {
      if (!r.capOptions) r.capOptions = capOptionsFor(r.c);
      // После ответа варианты не убираем: видно и верный (зелёная рамка), и то,
      // что нажали вы (красная) — так столица и запоминается.
      box.appendChild(el("div", { class: "options" }, r.capOptions.map(function (opt) {
        var cls = "btn";
        if (r.capDone) {
          cls += " done";
          if (opt === r.c.c) cls += " right";
          else if (opt === st.capital) cls += " wrong";
        }
        return el("button", {
          class: cls, type: "button",
          onclick: function () {
            if (r.capDone) return;
            st.capital = opt; r.capDone = true; r.capOk = opt === r.c.c; render();
          }
        }, [opt]);
      })));
    } else if (!r.capDone) {
      var input = el("input", { class: "input", id: "cap", type: "text", placeholder: "Введите название", autocomplete: "off", style: "margin-top:10px;font-size:20px",
        oninput: function (e) { st.capital = e.target.value; },
        onkeydown: function (e) { if (e.key === "Enter") submitCap(); } });
      box.appendChild(el("div", { class: "row", style: "align-items:flex-end;max-width:640px" }, [
        el("div", { class: "field", style: "flex:1;min-width:200px" }, [el("label", { class: "kicker", for: "cap" }, ["Столица"]), input]),
        el("button", { class: "btn primary", type: "button", onclick: submitCap }, ["Ответить"])
      ]));
      if (r.hint) box.appendChild(el("p", { class: "verdict", style: "margin:16px 0 0" }, ["Начинается на «" + r.hint + "…»"]));
      else if (CA.hintsLeft() > 0) box.appendChild(el("p", { style: "margin:18px 0 0;font-size:16px;color:var(--n700)" }, [
        CA.premiumEnabled ? "Осталось подсказок: " + CA.progress.hints + " · " : "Не помните? ",
        el("a", { href: "#", onclick: function (e) { e.preventDefault(); CA.spendHint(); r.hint = r.c.c.slice(0, 2); render(); } }, ["показать первые буквы"])
      ]));
      else box.appendChild(el("p", { style: "margin:18px 0 0;font-size:16px;color:var(--n700)" }, ["Подсказки на сегодня закончились."]));
      setTimeout(function () { var i = document.getElementById("cap"); if (i) { i.value = st.capital; i.focus(); } }, 0);
    }
    if (r.capDone) {
      var said = (st.capital || "").trim();
      box.appendChild(CA.verdict(r.capOk, r.capOk
        ? ["Столица — ", el("b", { style: "font-weight:600" }, [r.c.c]), ". Плюс 10 очков."]
        : [said ? "Ваш ответ — «" + said + "»." : "Ответа не было.",
           " Правильный ответ — ", el("b", { style: "font-weight:600" }, [r.c.c]),
           ". Страну добавили в список «Стоит повторить» — он ждёт в конце сессии."]));
      box.appendChild(el("button", { class: "btn primary", type: "button", onclick: function () { r.step = "flag"; render(); } }, ["Дальше · флаг"]));
    }
    return box;
  }
  function submitCap() {
    var r = st.round;
    if (r.capDone) return;
    r.capDone = true; r.capOk = CA.fuzzy(st.capital, r.c.c); render();
  }

  function stepFlag(r) {
    function flagButton(c, cls) {
      if (r.flagDone) { if (c.f === r.c.f) cls += " right"; else if (c.f === r.pick) cls += " wrong"; }
      return el("button", { class: cls, type: "button", onclick: function () {
        if (r.flagDone) return;
        r.flagDone = true; r.flagOk = c.f === r.c.f; r.pick = c.f; render();
      } }, [el("img", { src: CA.flagUrl(c.f), alt: "Флаг", loading: "lazy", decoding: "async" })]);
    }
    var box = el("div", { style: "padding-top:26px" }, [
      k("Шаг 2 из 3 · флаг", "ac"),
      el("h1", { class: "big", style: "font-size:clamp(30px,4.5vw,52px);margin:10px 0 12px" }, [r.c.n])
    ]);
    if (!r.flagDone) box.appendChild(el("p", { class: "ask" }, ["Выберите флаг этой страны"]));
    if (st.difficulty === "easy") {
      if (!r.flagOptions) r.flagOptions = flagOptionsFor(r.c);
      box.appendChild(el("div", { class: "flagopts" }, r.flagOptions.map(function (c) { return flagButton(c, "fl"); })));
    } else {
      var list = COUNTRIES.slice().sort(function (a, b) { return a.n.localeCompare(b.n, "ru"); });
      box.appendChild(el("div", { class: "flags" }, list.map(function (c) { return flagButton(c, "fl"); })));
    }
    if (r.flagDone) {
      box.appendChild(CA.verdict(r.flagOk, r.flagOk
        ? ["Это её флаг. Плюс 10 очков."]
        : ["Верный флаг обведён зелёным, ваш выбор — красным. Посмотрите на него пару секунд: в следующий раз узнаете."]));
      box.appendChild(el("button", { class: "btn primary", type: "button", onclick: function () { r.step = "map"; render(); } }, ["Дальше · карта"]));
    }
    return box;
  }

  function stepMap(r) {
    // Карта живёт между перерисовками: иначе после ответа она бы сама вернулась
    // к виду «весь мир», а человек только что приблизил нужный угол.
    if (!r.picker) {
      r.picker = CA.zoomMap({
        label: "Карта мира: укажите, где находится страна",
        onPick: function (p) {
          r.aim = p;
          r.picker.setMarks([
            { x: p.x, y: p.y, r: 14, fill: "#d6006c", opacity: 0.18 },
            { x: p.x, y: p.y, r: 7, fill: "#d6006c", stroke: "#fff" }
          ]);
          // Карта переживает перерисовку, а кнопка с подписью — нет, поэтому

      r.aim ? AIMED : "Метку можно двигать сколько угодно: ответ засчитается только по кнопке."
    ]);
    r.onAim = function () {

      note.textContent = AIMED;

    var box = el("div", { style: "padding-top:26px" }, [
      k("Шаг 3 из 3 · где это на карте", "ac"),
      el("h1", { class: "big", style: "font-size:clamp(28px,4vw,44px);margin:14px 0 18px" }, [r.c.n])
    ]);
    if (!r.mapDone) box.appendChild(el("p", { class: "ask", style: "margin-bottom:16px" }, ["Нажмите на карту там, где находится эта страна"]));
    box.appendChild(r.picker);
    if (!r.mapDone) {
      box.appendChild(el("p", { style: "margin:14px 0 0;font-size:15px;color:var(--n700)" }, [
        "Маленькую страну удобнее искать приближённой: кнопки + и − под картой, двойное нажатие по нужному месту, колесо мыши или щипок двумя пальцами. Приближённую карту можно двигать перетаскиванием."
      ]));
      box.appendChild(note);
      box.appendChild(el("div", { style: "margin-top:16px" }, [answer]));
    } else {
      box.appendChild(CA.verdict(r.mapOk, r.mapOk ? hitText(r) : missText(r)));
      box.appendChild(el("button", { class: "btn primary", type: "button", onclick: finish }, ["Итог раунда"]));
    }
    return box;
  }

  // Попадание тоже объясняем: «внутри контура» и «в двух шагах от островка,
  // который на карте не нарисовать» — разные вещи, и человек вправе знать, за
  // что ему поставили балл.
  function hitText(r) {
    if (r.mapWhy === "inside") return ["Отметка внутри страны. Плюс 10 очков."];
    if (r.mapWhy === "near") return ["Отметка у самой границы — засчитано. Плюс 10 очков."];
    var lng = r.aim ? r.aim.lng : (r.click.x / 1000 * 360 - 180);
    var lat = r.aim ? r.aim.lat : (90 - r.click.y / 500 * 180);
    var km = CA.formatKm(CA.distanceKm(lng, lat, r.c.lng, r.c.lat));
    return [r.c.n + " настолько мала, что контур на карте не нарисовать, — засчитываем отметку рядом: до неё около " + km + ". Плюс 10 очков."];
  }

  // Промах объясняем предметно: куда именно попала отметка и как далеко это от
  // нужной страны. «Мимо» ничему не учит, а «это Казахстан, до цели 1 900 км» —
  // вполне.
  function missText(r) {
    var lng = r.aim ? r.aim.lng : (r.click.x / 1000 * 360 - 180);
    var lat = r.aim ? r.aim.lat : (90 - r.click.y / 500 * 180);
    var where = CA.placeName(lng, lat);
    var km = CA.formatKm(CA.distanceKm(lng, lat, r.c.lng, r.c.lat));
    return [
      "Красная точка — ваша отметка: " + (where ? "это " + where + "." : "это открытое море, суши там нет."),
      " Зелёная показывает верное место — до него отсюда около " + km + ". Страну добавили в список «Стоит повторить»."
    ];
  }

  function submitMap(r, aim) {
    var t = CA.project(r.c.lng, r.c.lat);
    var dist = Math.sqrt(Math.pow(aim.x - t.x, 2) + Math.pow(aim.y - t.y, 2));
    // Допуск считаем в экранных пикселях: сколько бы карту ни приближали, промах
    // шириной в палец засчитываем — но не больше. Запас по размеру страны здесь
    // потолок, а не пол: раньше он был полом и побеждал приближение. У Мальты
    // он равен 22 единицам карты, то есть почти 800 км, и отметка на Балканах
    // шла в зачёт даже при десятикратном увеличении.
    var finger = Math.max(28 * aim.upp, 3);
    // Спрашиваем «где страна», а не «где её столица»: клик в Сибири — это Россия,
    // даже если до Москвы оттуда полкарты. Поэтому смотрим на попадание в контур,
    // и лишь у крошечных государств без контура — на расстояние до столицы.
    var ins = CA.insideCountry(r.c.f, aim.lng, aim.lat);
    if (ins === null) {
      r.mapOk = dist <= Math.min(1000 * (CA.SIZE_TOL[r.c.s] || 0.038), finger);
      r.mapWhy = "dot";
    } else if (ins) {
      r.mapOk = true; r.mapWhy = "inside";
    } else {
      r.mapOk = CA.nearCountry(r.c.f, aim.x, aim.y, Math.min(12, finger)) && !CA.insideAnyOther(r.c.f, aim.lng, aim.lat);
      r.mapWhy = "near";
    }
    r.mapDone = true; r.click = { x: aim.x, y: aim.y }; r.target = t;

    var pins = [{ x: aim.x, y: aim.y, r: 8, fill: r.mapOk ? "#1f8a4c" : "#d92b2b", stroke: "#fff" }];
    if (!r.mapOk) pins.push({ x: t.x, y: t.y, r: 7, fill: "#1f8a4c", stroke: "#fff" });
    r.picker.setMarks(pins);
    r.picker.setHighlight(r.c.f, "#a8ddba");
    r.picker.stopPicking();
    render();
  }

  function finish() {
    var r = st.round;
    var raw = (r.capOk ? 10 : 0) + (r.flagOk ? 10 : 0) + (r.mapOk ? 10 : 0);
    var clean = r.capOk && r.flagOk && r.mapOk;
    if (r.capOk) st.tally.cap++;
    if (r.flagOk) st.tally.flag++;
    if (r.mapOk) st.tally.map++;
    if (clean) st.tally.clean++;
    st.combo = clean ? st.combo + 1 : 0;
    r.mult = st.combo >= 3 ? 1.5 : 1;
    r.points = Math.round(raw * r.mult);
    st.score += r.points;
    var e = CA.progress.perCountry[r.c.f] || { attempts: 0, sumScore: 0, mistakes: { capital: 0, flag: 0, map: 0 } };
    e.attempts++; e.sumScore += raw;
    if (!r.capOk) e.mistakes.capital++;
    if (!r.flagOk) e.mistakes.flag++;
    if (!r.mapOk) e.mistakes.map++;
    CA.progress.perCountry[r.c.f] = e;
    CA.progress.totalRounds = (CA.progress.totalRounds || 0) + 1;
    CA.saveProgress();
    if (!clean) {
      var what = [];
      if (!r.capOk) what.push("столица");
      if (!r.flagOk) what.push("флаг");
      if (!r.mapOk) what.push("карта");
      st.mistakes[r.c.n] = { iso: r.c.f, what: what.join(", ") };
    }
    r.step = "summary"; render();
  }

  function stepSummary(r) {
    var rows = [
      ["Столица — " + r.c.c, r.capOk ? "верно · +10" : "неверно", r.capOk],
      ["Флаг", r.flagOk ? "верно · +10" : "неверно", r.flagOk],
      ["Место на карте", r.mapOk ? "верно · +10" : "мимо", r.mapOk],
      ["Множитель комбо", "×" + r.mult, true]
    ];
    var last = st.i + 1 >= st.queue.length;
    return el("div", { style: "padding-top:30px" }, [el("div", { class: "grid two", style: "align-items:start" }, [
      el("div", {}, [
        el("h1", { class: "big", style: "font-size:clamp(34px,5.5vw,64px);margin-bottom:26px" }, [r.c.n]),
        el("table", {}, [el("tbody", {}, rows.map(function (row) {
          return el("tr", {}, [el("td", {}, [row[0]]), el("td", { class: row[2] ? "ok" : "bad", style: "text-align:right" }, [row[1]])]);
        }))])
      ]),
      el("div", {}, [
        k("За раунд"), el("div", { class: "num" }, ["+" + r.points]),
        el("p", { style: "margin:14px 0 26px;color:var(--n800);font-size:16px" }, [
          r.capOk && r.flagOk && r.mapOk ? r.c.n + " теперь идёт в зачёт как изученная страна." : "Страна вернётся в подборку для повторения."
        ]),
        el("button", { class: "btn primary block", type: "button", onclick: next }, [last ? "Итоги сессии" : "Дальше"]),
        el("div", { style: "margin-top:14px" }, [el("a", { class: "btn ghost block", href: "country.html?iso=" + r.c.f + "&from=play", style: "text-align:center" }, ["Открыть карточку страны"])])
      ])
    ])]);
  }

  function next() {
    var n = st.i + 1;
    if (n >= st.queue.length) {
      if (st.score > (CA.progress.highScore || 0)) { CA.progress.highScore = st.score; CA.saveProgress(); }
      st.view = "end"; sendResult(); render(); return;
    }
    st.i = n; st.capital = ""; st.round = newRound(st.queue[n]); render();
  }
  function sendResult() {
    if (st.submitted || st.sending || !CA.currentDisplayName()) return;
    st.sending = true; st.submitMsg = "Отправляем результат в рейтинг…";
    CA.submitToLeaderboard(st.region, st.queue.length, st.score, function (ok, err) {
      st.sending = false; st.submitted = ok;
      st.submitMsg = ok ? "Результат отправлен в рейтинг недели." : ("Не получилось отправить: " + err);
      render();
    });
  }

  function viewEnd() {
    var names = Object.keys(st.mistakes);
    var right = el("div", {}, [el("h2", { style: "font-size:30px;line-height:34px;margin-bottom:18px" }, ["Стоит повторить"])]);
    if (names.length) {
      right.appendChild(el("div", { class: "list" }, names.map(function (n) {
        return el("a", { class: "li clickable", href: "country.html?iso=" + st.mistakes[n].iso + "&from=play" }, [
          el("span", {}, [n]), el("span", { style: "color:var(--n700)" }, [st.mistakes[n].what])
        ]);
      })));
      right.appendChild(el("div", { style: "margin-top:18px" }, [el("button", { class: "btn", type: "button", onclick: function () {
        var isos = names.map(function (n) { return st.mistakes[n].iso; });
        start(st.region, isos.length, COUNTRIES.filter(function (c) { return isos.indexOf(c.f) >= 0; }));
      } }, ["Собрать раунд из этих стран"])]));
    } else right.appendChild(el("p", { class: "verdict" }, ["Ни одной осечки. Такое бывает нечасто."]));

    var sendWrap = el("div", { style: "margin-top:24px" });
    if (!CA.currentDisplayName()) sendWrap.appendChild(el("p", { style: "margin:0;font-size:16px;color:var(--n800)" }, [
      "Чтобы попадать в рейтинг недели, выберите титул в ", el("a", { href: "settings.html" }, ["настройках"]), "."
    ]));
    else {
      sendWrap.appendChild(el("p", { style: "margin:0;font-size:16px;color:var(--n800)" }, [st.submitMsg || "Результат уходит в рейтинг недели сам."]));
      sendWrap.appendChild(el("p", { style: "margin:10px 0 0;font-size:16px;color:var(--n800)" }, [
        "Ваш код игрока — ", el("b", { style: "font-weight:600;letter-spacing:.08em" }, [CA.myCode()]),
        ". Запишите его: по нему вы вернёте свой номер, если браузер очистит данные сайта."
      ]));
      if (!st.submitted && !st.sending) sendWrap.appendChild(el("div", { style: "margin-top:12px" }, [
        el("button", { class: "btn", type: "button", onclick: sendResult }, ["Отправить ещё раз"])
      ]));
    }

    var n = st.queue.length, t = st.tally;
    var record = st.score >= (CA.progress.highScore || 0) && st.score > 0;
    var card = el("div", { class: "result" }, [
      k(record ? "Личный рекорд" : "Результат сессии", record ? "sp" : null),
      el("div", { class: "num" }, [String(st.score)]),
      el("p", { class: "result-sub" }, [
        "очков · " + CA.regionName(st.region) + " · " + n + " " + countryWord(n) +
        (record ? "" : " · рекорд " + (CA.progress.highScore || 0))
      ]),
      el("div", { class: "result-rows" }, [
        el("div", {}, [el("span", {}, ["Столицы"]), el("b", {}, [t.cap + " / " + n])]),
        el("div", {}, [el("span", {}, ["Флаги"]), el("b", {}, [t.flag + " / " + n])]),
        el("div", {}, [el("span", {}, ["На карте"]), el("b", {}, [t.map + " / " + n])]),
        el("div", {}, [el("span", {}, ["Без ошибок"]), el("b", {}, [t.clean + " / " + n])])
      ])
    ]);

    // Текст для друзей: короткий, с разбивкой по шагам и без ссылки внутри —
    // ссылку Телеграм и ВК подставляют сами, отдельным полем.
    var shareText = "Cosmopolitan Atlas 🌍 " + CA.regionName(st.region) + ", " + n + " " + countryWord(n) +
      " — " + st.score + " очков.\nСтолицы " + t.cap + "/" + n + " · флаги " + t.flag + "/" + n +
      " · на карте " + t.map + "/" + n + ".\nА сколько наберёшь ты?";

    return el("div", { class: "screen" }, [
      k(CA.regionName(st.region) + " · " + n + " " + countryWord(n) + " · сессия завершена"),
      el("div", { class: "grid two", style: "margin-top:14px;align-items:start" }, [
        el("div", {}, [
          card,
          el("div", { class: "row", style: "margin-top:22px" }, [
            el("button", { class: "btn primary", type: "button", onclick: function () { start(st.region, st.queue.length); } }, ["Играть ещё раз"]),
            el("button", { class: "btn ghost", type: "button", onclick: function () { st.view = "regions"; render(); } }, ["Другой регион"])
          ]),
          CA.shareBlock({
            text: shareText, title: "Мой результат в Cosmopolitan Atlas",
            card: {
              badge: record ? "личный рекорд" : "результат сессии",
              score: st.score,
              sub: "очков · " + CA.regionName(st.region) + " · " + n + " " + countryWord(n),
              rows: [
                ["Столицы", t.cap + " / " + n],
                ["Флаги", t.flag + " / " + n],
                ["На карте", t.map + " / " + n],
                ["Без ошибок", t.clean + " / " + n]
              ]
            }
          }),
          sendWrap
        ]),
        right
      ])
    ]);
  }

  if (CA.qs("resume") && restoreGame(CA.loadSession())) { render(); return; }
  if (forcedIso) {
    var c = CA.byIso(forcedIso);
    if (c) { start(c.r, 1, [c]); return; }
  }
  render();
});
</script>
</body>
</html>
