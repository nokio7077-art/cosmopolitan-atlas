<meta name="description" content="Учебные карточки без таймера: флаг, страна, её столица, население и карта, где находится государство. Удобно готовиться к уроку географии и олимпиаде.">

<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="core.js"></script>
<script>
CA.ready(function () {
  var el = CA.el, k = CA.kicker, app = document.getElementById("app");
  var st = { view: "regions", region: null, queue: [], i: 0 };

  function render() {
    app.innerHTML = "";
    CA.mount(st.view === "regions" ? viewRegions() : viewCard());
    window.scrollTo(0, 0);
  }

  function viewRegions() {
    return el("div", { class: "screen" }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px" }, [
        el("a", { href: "index.html" }, ["← На главную"]), k("Режим обучения")
      ]),
      el("h1", { class: "big", style: "font-size:clamp(32px,4.5vw,48px);margin-bottom:14px" }, ["Карточки без таймера"]),
      el("p", { class: "lede", style: "margin:0 0 28px" }, ["На лице карточки флаг и страна, на обороте — столица, население, регион и факт о флаге. Всё о стране — в одной карточке."]),
      el("div", { class: "tile-list" }, ["world"].concat(CA.REGION_ORDER).map(function (key) {
        var list = CA.regionCountries(key), locked = !CA.unlocked(key);
        return el("a", { class: "tile", href: locked ? "premium.html" : "#", onclick: function (e) {
          if (locked) return;
          e.preventDefault();
          st.region = key; st.queue = CA.shuffle(list); st.i = 0; st.view = "card"; render();
        } }, [
          el("div", { style: "display:flex;align-items:baseline;gap:12px" }, [
            el("h3", {}, [CA.regionName(key)]), locked ? el("span", { class: "tag" }, ["Премиум"]) : null
          ]),
          el("div", { class: "meta" }, [el("span", {}, [list.length + " карточек"]), el("span", {}, [CA.studiedCount(key) + " изучено"])])
        ]);
      }))
    ]);
  }

  function viewCard() {
    var c = st.queue[st.i];
    // Карточка одна на весь сайт: то же, что на странице страны, только здесь её
    // можно листать. Переворот живёт внутри самой карточки, перерисовка не нужна.
    var card = CA.countryCard(c);
    var nav = el("div", { class: "row", style: "margin-top:26px" }, [
      el("button", { class: "btn ghost", type: "button", onclick: function () { st.i = Math.max(0, st.i - 1); render(); } }, ["← Назад"]),
      el("button", { class: "btn primary", type: "button", onclick: function () { st.i = Math.min(st.queue.length - 1, st.i + 1); render(); } }, ["Дальше →"]),
      el("a", { class: "btn", href: "play.html?iso=" + c.f }, ["Сыграть эту страну"])
    ]);

    return el("div", { class: "screen" }, [
      el("div", { style: "display:flex;justify-content:space-between;align-items:baseline;margin-bottom:26px;gap:16px;flex-wrap:wrap" }, [
        el("a", { href: "#", onclick: function (e) { e.preventDefault(); st.view = "regions"; render(); } }, ["← Регионы"]),
        k(CA.regionName(st.region) + " · карточка " + (st.i + 1) + " из " + st.queue.length)
      ]),
      el("div", { class: "grid two", style: "align-items:start" }, [
        card,
        el("div", {}, [CA.locator(c), nav])
      ])
    ]);
  }

  render();
});
</script>
</body>
